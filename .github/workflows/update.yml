name: update-news

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 뉴스 수집
        run: python collect.py

      - name: 변경사항 저장
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add news.json history.json
          git commit -m "뉴스 업데이트" || exit 0
          git push
